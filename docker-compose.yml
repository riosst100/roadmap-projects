services:
  app:
    build: .
    container_name: roadmap-app
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: file:/app/data/dev.db
      NODE_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - db_data:/app/data
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
  db_data:
